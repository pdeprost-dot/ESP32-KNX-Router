[platformio]
default_envs = wemos_d1_mini32

[env:wemos_d1_mini32]
platform = espressif32@6.12.0
board = wemos_d1_mini32
board_build.partitions = partitions_ota_1792.csv
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
  https://github.com/thelsing/knx.git#980c047ad7fc5e27bf2fae95e48acde5d5e0b4fd
  https://github.com/pdeprost-dot/ESP_BASE.git#esp-base-2.4.2
  knolleary/PubSubClient@2.8
build_flags =
  -D MASK_VERSION=0x091A
  -D KNX_TUNNELING=4
  -D KNX_ACTIVITYCALLBACK
  -D KNX_NO_AUTOMATIC_GLOBAL_INSTANCE
  -D KNX_UART_RX_PIN=16
  -D KNX_UART_TX_PIN=17
  -D KNX_NETWORK_TRANSPORT=2
  -D KNX_BUTTON=-1
  -D KNX_LED=-1
  -Wno-unknown-pragmas

[env:olimex_poe_iso_16mb]
platform = espressif32@6.12.0
board = esp32-poe-iso
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.partitions = partitions_ota_16mb.csv
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
  https://github.com/thelsing/knx.git#980c047ad7fc5e27bf2fae95e48acde5d5e0b4fd
  https://github.com/pdeprost-dot/ESP_BASE.git#esp-base-2.4.2
  knolleary/PubSubClient@2.8
build_flags =
  -D MASK_VERSION=0x091A
  -D KNX_TUNNELING=4
  -D KNX_ACTIVITYCALLBACK
  -D KNX_NO_AUTOMATIC_GLOBAL_INSTANCE
  -D KNX_UART_RX_PIN=36
  -D KNX_UART_TX_PIN=4
  -D KNX_RX_PIN=36
  -D KNX_TX_PIN=4
  -D KNX_NETWORK_TRANSPORT=1
  -D KNX_BUTTON=-1
  -D KNX_LED=-1
  -Wno-unknown-pragmas

[env:olimex_poe_iso_16mb_wifi]
platform = espressif32@6.12.0
board = esp32-poe-iso
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.partitions = partitions_ota_16mb.csv
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
  https://github.com/thelsing/knx.git#980c047ad7fc5e27bf2fae95e48acde5d5e0b4fd
  https://github.com/pdeprost-dot/ESP_BASE.git#esp-base-2.4.2
  knolleary/PubSubClient@2.8
build_flags =
  -D MASK_VERSION=0x091A
  -D KNX_TUNNELING=4
  -D KNX_ACTIVITYCALLBACK
  -D KNX_NO_AUTOMATIC_GLOBAL_INSTANCE
  -D KNX_UART_RX_PIN=36
  -D KNX_UART_TX_PIN=4
  -D KNX_RX_PIN=36
  -D KNX_TX_PIN=4
  -D KNX_NETWORK_TRANSPORT=2
  -D KNX_BUTTON=-1
  -D KNX_LED=-1
  -Wno-unknown-pragmas

[env:olimex_poe_iso_16mb_wifi_simulated]
extends = env:olimex_poe_iso_16mb_wifi
build_flags =
  ${env:olimex_poe_iso_16mb_wifi.build_flags}
  -D TP1_INTERFACE_MODE=2

