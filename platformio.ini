[platformio]
default_envs = wemos_d1_mini32

[env:wemos_d1_mini32]
platform = espressif32@6.12.0
board = wemos_d1_mini32
board_build.partitions = partitions_ota_1792.csv
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
  https://github.com/thelsing/knx.git#980c047ad7fc5e27bf2fae95e48acde5d5e0b4fd
  ESP_BASE=file://C:/H/pierredoc/SharedChatGpt/ESP_BASE
  knolleary/PubSubClient@2.8
build_flags =
  -D MASK_VERSION=0x091A
  -D KNX_TUNNELING=4
  -D KNX_ACTIVITYCALLBACK
  -D KNX_NO_AUTOMATIC_GLOBAL_INSTANCE
  -D KNX_UART_RX_PIN=16
  -D KNX_UART_TX_PIN=17
  -D KNX_BUTTON=-1
  -D KNX_LED=-1
  -Wno-unknown-pragmas

